{% extends 'base.html' %}

{% block title %}My Profile - TrekHorizon{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 mt-3">
            <div class="card-header bg-dark text-white text-center py-3">
                <h4 class="card-title mb-0">🛠️ Edit Profile Settings</h4>
            </div>
            
            <div class="card-body p-4">
                <form action="/user/profile" method="POST">
                    
                    <div class="mb-3">
                        <label for="email" class="form-label text-muted small fw-bold">Email Address (Account ID)</label>
                        <input type="email" id="email" class="form-control bg-body-secondary text-muted" value="{{ user.email }}" readonly>
                        <div class="form-text text-danger small">Email address cannot be changed.</div>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label small fw-bold">Full Name</label>
                        <input type="text" id="name" name="name" class="form-control" value="{{ user.name }}" required autocomplete="name">
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label small fw-bold">Contact Number</label>
                        <input type="tel" id="phone" name="phone" class="form-control" value="{{ user.phone }}" required autocomplete="tel">
                    </div>

                    <hr class="my-4 text-muted">

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary fw-bold">
                            💾 Save Account Changes
                        </button>
                        <a href="/dashboard" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
