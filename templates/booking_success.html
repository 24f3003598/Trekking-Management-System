{% extends 'base.html' %}
{% block title %}Booking Successful{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="alert alert-success text-center py-4">
                <h4 class="alert-heading fw-bold">Booking Confirmed!</h4>
                <p>Your journey for <strong>{{ trek.trek_name }}</strong> has been registered successfully.</p>
                <hr>
                <a href="{{ url_for('explore_treks') }}" class="btn btn-outline-success">Back to Explore</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
