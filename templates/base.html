<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TrekHorizon Layout{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="/dashboard">TrekHorizon</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#appNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="appNavbar">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard </a></li>
                    {% if session['user_role'] == 'Admin' %}
                    <li class="nav-item"><a class="nav-link" href="/admin/staff-details">Manage Staff</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/user-details">Manage Users</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/treks">Manage Treks</a></li>
                    {% endif %}
                </ul>
                <div class="navbar-nav ms-auto align-items-center">
                    <span class="text-light me-3 small">
                        Hi, <strong>{{ session['user_name'] }}</strong>     
                    </span>
                    <a class="btn btn-sm btn-outline-danger fw-bold px-3" href="/logout">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1 container my-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
