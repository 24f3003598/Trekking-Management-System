{% extends 'base.html' %}

{% block title %}Booking Failed{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="alert alert-danger text-center py-4" role="alert">
                <h4 class="alert-heading fw-bold"> Booking Failed</h4>
                <p class="mb-0">{{ reason }}</p>
            </div>

            <div class="text-center mt-4">
                <a href="/explore-treks" class="btn btn-secondary">Return to Explore</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
