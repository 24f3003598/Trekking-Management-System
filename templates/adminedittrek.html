{% extends 'base.html' %}

{% block title %}Admin - Edit Trek Parameters{% endblock %}

{% block content %}
<div class="container" style="max-width: 700px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white py-3">
            <h4 class="mb-0">Modify Trek Parameters: ID #{{ trek.trek_id }}</h4>
        </div>
        <div class="card-body p-4">
            <form action="/admin/trek/edit/{{ trek.trek_id }}" method="POST">
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Trek Name</label>
                    <input type="text" name="trek_name" class="form-control" value="{{ trek.trek_name }}" required>
                </div>

                <div class="row">
                    <div class="mb-3 col-md-6">
                        <label class="form-label fw-bold">Location</label>
                        <input type="text" name="location" class="form-control" value="{{ trek.location }}" required>
                    </div>
                    <div class="mb-3 col-md-6">
                        <label class="form-label fw-bold">Cost Per Person ($)</label>
                        <input type="number" step="0.01" name="cost_per_person" class="form-control" value="{{ trek.cost_per_person }}" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Difficulty Profile</label>
                        <select name="difficulty" class="form-select" required>
                            <option value="Easy" {% if trek.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
                            <option value="Moderate" {% if trek.difficulty == 'Moderate' %}selected{% endif %}>Moderate</option>
                            <option value="Hard" {% if trek.difficulty == 'Hard' %}selected{% endif %}>Hard</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Duration (Days)</label>
                        <input type="number" name="duration_days" class="form-control" min="1" value="{{ trek.duration_days }}" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Max Capacity Slots</label>
                        <input type="number" name="max_slots" class="form-control" min="1" value="{{ trek.max_slots }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Current Operational Status</label>
                        <select name="status" class="form-select">
                            <option value="Pending" {% if trek.status == 'Pending' %}selected{% endif %}>Pending</option>
                            <option value="Approved" {% if trek.status == 'Approved' %}selected{% endif %}>Approved</option>
                            <option value="Open" {% if trek.status == 'Open' %}selected{% endif %}>Open</option>
                            <option value="Closed" {% if trek.status == 'Closed' %}selected{% endif %}>Closed</option>
                            <option value="Completed" {% if trek.status == 'Completed' %}selected{% endif %}>Completed</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Start Date</label>
                        <input type="date" name="start_date" class="form-control" value="{{ trek.start_date.strftime('%Y-%m-%d') }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">End Date</label>
                        <input type="date" name="end_date" class="form-control" value="{{ trek.end_date.strftime('%Y-%m-%d') }}" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Meeting Point</label>
                    <input type="text" name="meeting_point" class="form-control" value="{{ trek.meeting_point }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Trek Description</label>
                    <textarea name="description" class="form-control" rows="3">{{ trek.description }}</textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Reassign Staff Guide Leader</label>
                    <select name="assigned_staff_id" class="form-select">
                        <option value="">-- Clear Current Assignment --</option>
                        {% for member in staff %}
                            <option value="{{ member.user_id }}" {% if trek.assigned_staff_id == member.user_id %}selected{% endif %}>
                                {{ member.name }} (ID: #{{ member.user_id }})
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="d-flex justify-content-between align-items-center pt-2">
                    <a href="/admin/treks" class="text-decoration-none text-secondary">&larr; Return to Dashboard</a>
                    <button type="submit" class="btn btn-dark px-4">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
