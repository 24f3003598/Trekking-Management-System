<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrekHorizon - Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand font-weight-bold" href="/">TrekHorizon</a>
            <div>
                <a class="btn btn-outline-light btn-sm me-2" href="/login">Sign In</a>
                <a class="btn btn-primary btn-sm" href="/register">Register</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                
                <div class="card p-4 shadow-sm border bg-white rounded-3">
                    <div class="card-body">
                        
                        <h2 class="text-center mb-4 fw-bold text-dark">Sign In</h2>
                        
                        <form action="/login" method="POST">
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-secondary">Email Address</label>
                                <input type="email" name="email" class="form-control py-2" placeholder="username@email.com" required>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-semibold text-secondary">Password</label>
                                <input type="password" name="password" class="form-control py-2" placeholder="••••••••" required>
                            </div>
                            
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold fs-6 rounded-3 shadow-sm">
                                    Login to Dashboard
                                </button>
                            </div>
                            
                        </form>
                        
                        <div class="text-center mt-4 pt-2 border-top">
                            <span class="text-muted small">New to our trails?</span>
                            <a href="/register" class="text-decoration-none small fw-bold text-primary ms-1">Create an Account</a>
                        </div>
                        
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
